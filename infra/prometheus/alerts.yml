# Adapter les noms de métriques à ceux exposés par l'API (ici : prometheus-fastapi-instrumentator)
groups:
  - name: resilience-alpha
    rules:
      - alert: ServiceDown
        expr: up{job=~"api|auth|postgres"} == 0
        for: 5s
        labels:
          severity: critical
          type: availability
        annotations:
          summary: "Service {{ $labels.job }} injoignable"

      - alert: HighErrorRate
        expr: |
          sum(rate(http_requests_total{job="api",status=~"5.*"}[30s]))
          / clamp_min(sum(rate(http_requests_total{job="api"}[30s])), 1) > 0.2
        for: 10s
        labels:
          severity: critical
          type: availability
        annotations:
          summary: "Taux d'erreurs 5xx élevé sur l'API"

      - alert: HighLatencyP95
        expr: |
          histogram_quantile(0.95,
            sum by (le) (rate(http_request_duration_seconds_bucket{job="api"}[30s]))) > 1
        for: 10s
        labels:
          severity: warning
          type: performance
        annotations:
          summary: "Latence p95 de l'API supérieure à 1 s"
      
      - alert: DoS-ConnectionFlood
        expr: nginx_connections_active{job="waf"} > 200
        for: 10s
        labels:
          severity: critical
          scenario: dos_connection_flood
        annotations:
          summary: "Pic de connexions détecté sur le WAF"
          description: "{{ $value }} connexions actives, seuil dépassé"

      - alert: SQLi-WAFBlocked
        expr: count_over_time({container="waf-modsecurity"} |= "Access denied" [1m]) > 20
        for: 0s
        labels:
          severity: warning
          scenario: sqli_blocked
        annotations:
          summary: "Blocages WAF répétés détectés"
