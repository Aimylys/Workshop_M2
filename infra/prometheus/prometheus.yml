global:
  scrape_interval: 5s        # court pour détecter vite (à garder si la RAM le permet)
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Services métier (adapter les ports à ceux choisis avec le dev)
  - job_name: api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]

  - job_name: auth
    metrics_path: /metrics
    static_configs:
      - targets: ["auth:8000"]

  - job_name: ml
    static_configs:
      - targets: ["ml:8000"]

  - job_name: orchestrator
    static_configs:
      - targets: ["orchestrator:8000"]

  # Base de données (via postgres-exporter)
  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  # CPU / RAM des conteneurs (cAdvisor peut être capricieux sous Docker Desktop/WSL2)
  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  # WAF : décommenter si un exporter nginx est ajouté
  # - job_name: waf
  #   static_configs:
  #     - targets: ["nginx-exporter:9113"]
