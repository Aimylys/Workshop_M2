global:
  scrape_interval: 5s          # un échantillon toutes les 5 s : assez fin pour détecter vite
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:9090"]

  # Microservices : métriques sur le port interne 9000 (jamais publié)
  - job_name: auth
    static_configs:
      - targets: ["auth:9000"]
  - job_name: payment-api
    static_configs:
      - targets: ["payment-api:9000"]

  # WAF : connexions et requêtes vues en bordure (stub_status via l'exporter nginx)
  - job_name: waf
    static_configs:
      - targets: ["nginx-exporter:9113"]

  # Conteneurs : CPU, mémoire, réseau
  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  # Alloy : collecte des journaux + compteurs dérivés des journaux du WAF
  - job_name: alloy
    static_configs:
      - targets: ["alloy:12345"]

  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]
