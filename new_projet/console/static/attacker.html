<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Console attaquant — Resilience-Alpha</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, sans-serif; background: #130b10; color: #f0e5e9; }
  header { display: flex; align-items: center; justify-content: space-between;
           padding: 14px 24px; border-bottom: 1px solid #3a1e28; background: #1c0e14; }
  header h1 { font-size: 16px; margin: 0; color: #ff9a8c; font-weight: 600; letter-spacing: .5px; }
  header a { color: #7aa2f7; text-decoration: none; font-weight: 600; }
  main { padding: 20px 24px; max-width: 980px; margin: 0 auto; }
  .warn { background: #241017; border: 1px solid #c0392b; border-radius: 10px; padding: 10px 16px;
          font-size: 13px; color: #ffb3a7; margin-bottom: 18px; }
  .live { background: #0e142a; border: 1px solid #1e2742; border-radius: 10px; padding: 12px 16px;
          margin-bottom: 20px; font-size: 14px; color: #9fb3d1; display: flex; justify-content: space-between; align-items: center; }
  .live b { font-size: 16px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px; }
  .card { background: #1c121a; border: 1px solid #3a1e28; border-radius: 12px; padding: 16px 18px; }
  .card.on { border-color: #c0392b; background: #261017; box-shadow: 0 0 0 1px #c0392b inset; }
  .card h3 { margin: 0 0 4px; font-size: 16px; }
  .card .eff { font-size: 12px; color: #c99; margin-bottom: 12px; line-height: 1.5; }
  .row { display: flex; gap: 8px; align-items: center; }
  button { border: 0; border-radius: 8px; padding: 9px 16px; font-size: 13px; font-weight: 600; cursor: pointer; }
  .go { background: #c0392b; color: #fff; } .go:hover { background: #d8452f; }
  .stop { background: #2a3657; color: #cdd6f4; } .stop:hover { background: #38466e; }
  button:disabled { opacity: .4; cursor: default; }
  .state { margin-left: auto; font-size: 12px; font-weight: 700; }
  .state.run { color: #ff6b5a; } .state.idle { color: #6b7a99; }
</style>
</head>
<body>
<header>
  <h1>⚡ CONSOLE ATTAQUANT (LABORATOIRE LOCAL)</h1>
  <div><a href="/">← Dashboard SOC</a></div>
</header>
<main>
  <div class="warn">Environnement fermé : toutes les attaques visent uniquement la plateforme locale
    (127.0.0.1). Rôle du « PC Attaquant » du sujet. Observe l'effet en direct sur le dashboard SOC.</div>

  <div class="live">
    <span>Verdict actuel du détecteur :</span>
    <b id="verdict">…</b>
  </div>

  <div class="cards" id="cards"></div>
</main>

<script>
const ATTACKS = {
  ddos:          { nom: "DDoS (saturation)", eff: "Rafale de requêtes → bordure et latence ↑, virements légitimes évincés." },
  brute_force:   { nom: "Force brute (login)", eff: "Connexions en boucle sur un compte → échecs de connexion ↑, latence login ↑." },
  sql_injection: { nom: "Injection SQL", eff: "Charges SQLi → arrêtées par le WAF (requêtes bloquées ↑)." },
  port_scan:     { nom: "Reconnaissance", eff: "Sondage de chemins → nouvelles connexions ↑, 404 ↑." },
  service_down:  { nom: "Panne de service", eff: "Arrêt du conteneur base → virements = 0, erreurs base ↑ (chaos engineering)." },
};
let running = {};

function render() {
  document.getElementById("cards").innerHTML = Object.entries(ATTACKS).map(([k, a]) => {
    const on = running[k];
    return `<div class="card ${on?'on':''}">
      <h3>${a.nom}</h3>
      <div class="eff">${a.eff}</div>
      <div class="row">
        <button class="go" onclick="act('${k}','start')" ${on?'disabled':''}>Lancer</button>
        <button class="stop" onclick="act('${k}','stop')" ${on?'':'disabled'}>Arrêter</button>
        <span class="state ${on?'run':'idle'}">${on?'● EN COURS':'○ arrêté'}</span>
      </div></div>`;
  }).join("");
}

async function act(name, action) {
  await fetch(`/api/attacks/${name}/${action}`, { method: "POST" });
  await refresh();
}

async function refresh() {
  try {
    const a = await (await fetch("/api/attacks")).json();
    running = a.running; render();
    const s = await (await fetch("/api/status")).json();
    const el = document.getElementById("verdict");
    if (s.ready) {
      const v = s.verdict;
      el.textContent = v.is_attack ? "⚠ " + v.label.toUpperCase() + ` (${Math.round(v.confidence*100)}%)`
                      : v.label === "inconnu" ? "ÉTAT INCONNU" : "trafic normal";
      el.style.color = v.is_attack ? "#ff6b5a" : v.label === "inconnu" ? "#ffd98a" : "#7ee2a8";
    } else { el.textContent = "détecteur non prêt"; el.style.color = "#6b7a99"; }
  } catch { document.getElementById("verdict").textContent = "console injoignable"; }
}

render(); refresh();
setInterval(refresh, 3000);
</script>
</body>
</html>
