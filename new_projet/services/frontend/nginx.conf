# Frontal web : sert l'application React et relaie /api vers les microservices.
# Seuls /api/auth/* et /api/pay/* sont relayés ; les ports de métriques (9000) ne le sont jamais.
server {
    listen 8080;
    server_tokens off;
    root /usr/share/nginx/html;

    client_max_body_size 16k;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; frame-ancestors 'none'" always;

    # Le WAF (IP fixe 172.30.1.10 sur le réseau « web ») est le seul client de ce proxy.
    # On ne fait confiance qu'à lui pour l'IP réelle, qu'il pose dans X-Real-IP (il écrase
    # toute valeur envoyée par le client : pas d'usurpation possible).
    set_real_ip_from 172.30.1.10;
    real_ip_header X-Real-IP;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # On ÉCRASE X-Forwarded-For avec l'IP réelle : les microservices lisent cet en-tête.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    proxy_read_timeout 15s;

    location /api/auth/ {
        proxy_pass http://auth:8000/;
    }

    location /api/pay/ {
        proxy_pass http://payment-api:8000/;
    }

    # Documentation OpenAPI (Swagger UI charge ses scripts depuis un CDN) : CSP assouplie ICI seulement.
    location = /api/auth/docs {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' https://cdn.jsdelivr.net; img-src 'self' data: https://fastapi.tiangolo.com" always;
        proxy_pass http://auth:8000/docs;
    }

    location = /api/pay/docs {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' https://cdn.jsdelivr.net; img-src 'self' data: https://fastapi.tiangolo.com" always;
        proxy_pass http://payment-api:8000/docs;
    }

    location / {
        try_files $uri /index.html;
    }
}
