# Exclusions évaluées APRÈS le Core Rule Set (une justification par règle retirée).

# 920350 « Host header is a numeric IP address » : en laboratoire, la plateforme est jointe
# par son adresse IP (127.0.0.1 ou 192.168.137.1), sans nom DNS. La règle se déclencherait
# sur 100 % des requêtes légitimes et noierait le journal d'audit du SIEM.
SecRuleRemoveById 920350
