# Règles évaluées AVANT le Core Rule Set.

# Refuse toute requête dont l'IP source figure dans la liste de blocage tenue par la remédiation.
# 192.0.2.255 (plage de documentation RFC 5737) sert de valeur sentinelle : la liste n'est jamais vide.
SecRule REMOTE_ADDR "@ipMatchFromFile /etc/modsecurity.d/blocklist/blocked_ips.txt" \
    "id:100001,phase:1,deny,status:403,log,\
    msg:'IP source bloquee par la remediation automatique',\
    tag:'resilience-alpha/blocklist'"

# Sondes internes (santé du WAF, stub_status lu par l'exporter) : pas d'inspection CRS.
SecRule REQUEST_FILENAME "@rx ^/(?:healthz|metrics/nginx)$" \
    "id:100010,phase:1,pass,nolog,ctl:ruleEngine=Off"
