global:
  scrape_interval: 5s          # on échantillonne toutes les 5 s (bien pour le ML)
  evaluation_interval: 5s

scrape_configs:
  - job_name: 'api'
    static_configs:
      - targets: ['api:8000']

  - job_name: 'cadvisor'       # CPU / RAM / réseau par conteneur
    static_configs:
      - targets: ['cadvisor:8080']

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
